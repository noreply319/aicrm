<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sales Pipeline CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-2: #f0f2f7;
    --border: #e4e7ee;
    --text: #1a1d29;
    --text-2: #5b6275;
    --text-3: #8a90a2;
    --primary: #5b5bf7;
    --primary-soft: #ecebff;
    --danger: #e5484d;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.16);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117; --surface: #181b24; --surface-2: #1f232e; --border: #2a2f3c;
      --text: #eceef4; --text-2: #a4aabb; --text-3: #6f768a;
      --primary: #7c7cff; --primary-soft: #26264a;
      --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1117; --surface: #181b24; --surface-2: #1f232e; --border: #2a2f3c;
    --text: #eceef4; --text-2: #a4aabb; --text-3: #6f768a;
    --primary: #7c7cff; --primary-soft: #26264a;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Inter", "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .logo {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, #6d6dff, #a46bff); color: #fff; font-size: 16px;
  }
  .search {
    flex: 1; min-width: 180px; max-width: 360px; position: relative;
  }
  .search input {
    width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit;
  }
  .search input:focus { outline: none; border-color: var(--primary); background: var(--surface); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
  .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 500;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary); filter: brightness(1.08); }
  .btn-danger { color: var(--danger); }
  .icon-btn { padding: 9px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; padding: 20px 24px 4px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .stat .label { color: var(--text-3); font-size: 12px; font-weight: 500; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; letter-spacing: -.02em; }
  @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); padding: 16px 16px 0; } header { padding: 12px 16px; } }

  /* Board */
  .board {
    flex: 1; display: flex; gap: 14px; padding: 16px 24px 24px; overflow-x: auto; align-items: flex-start;
  }
  @media (max-width: 720px) { .board { padding: 16px; } }
  .column {
    flex: 0 0 290px; background: var(--surface-2); border-radius: 14px; display: flex; flex-direction: column;
    max-height: calc(100vh - 210px); border: 1px solid transparent; transition: border-color .15s, background .15s;
  }
  .column.drag-over { border-color: var(--primary); background: var(--primary-soft); }
  .col-head { padding: 14px 14px 10px; }
  .col-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .count {
    margin-left: auto; font-size: 12px; color: var(--text-2); background: var(--surface);
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
  }
  .col-sum { color: var(--text-3); font-size: 12px; margin-top: 4px; padding-left: 16px; }
  .cards { padding: 4px 10px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 60px; flex: 1; }
  .add-inline {
    margin: 0 10px 10px; padding: 8px; border-radius: 10px; border: 1px dashed var(--border);
    background: transparent; color: var(--text-3); font-weight: 500;
  }
  .add-inline:hover { color: var(--primary); border-color: var(--primary); }

  /* Card */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    box-shadow: var(--shadow); cursor: grab; transition: transform .12s, box-shadow .12s;
    user-select: none;
  }
  .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .card.dragging { opacity: .4; }
  .card:active { cursor: grabbing; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-company { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .card-contact { color: var(--text-2); font-size: 12.5px; margin-top: 2px; }
  .card-value { font-weight: 700; font-size: 15px; margin-top: 10px; letter-spacing: -.01em; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 6px; }
  .tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
  .prio-high { background: #fde8e8; color: #c62828; }
  .prio-mid { background: #fff3dc; color: #b26a00; }
  .prio-low { background: #e3f4ea; color: #1e7a44; }
  :root[data-theme="dark"] .prio-high { background: #3b1d20; color: #ff8a8a; }
  :root[data-theme="dark"] .prio-mid { background: #3a2c12; color: #ffc861; }
  :root[data-theme="dark"] .prio-low { background: #15301f; color: #6fdc9a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .prio-high { background: #3b1d20; color: #ff8a8a; }
    :root:not([data-theme="light"]) .prio-mid { background: #3a2c12; color: #ffc861; }
    :root:not([data-theme="light"]) .prio-low { background: #15301f; color: #6fdc9a; }
  }
  .card-date { font-size: 11.5px; color: var(--text-3); }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .placeholder { height: 4px; border-radius: 4px; background: var(--primary); margin: -2px 0; }
  .empty { text-align: center; color: var(--text-3); font-size: 12px; padding: 16px 0; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,12,20,.45); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .overlay.open { display: flex; animation: fade .15s; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    width: 100%; max-width: 520px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg);
    max-height: calc(100vh - 32px); overflow-y: auto; animation: pop .18s;
  }
  @keyframes pop { from { transform: translateY(8px) scale(.98) } to { transform: none } }
  .modal-head { padding: 20px 22px 6px; display: flex; align-items: center; }
  .modal-head h2 { margin: 0; font-size: 18px; }
  .modal-body { padding: 12px 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-2); }
  .field input, .field select, .field textarea {
    padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .modal-foot { padding: 14px 22px 20px; display: flex; gap: 8px; }
  @media (max-width: 520px) { .modal-body { grid-template-columns: 1fr; } }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500;
    opacity: 0; transition: all .2s; pointer-events: none; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="logo">◆</div> Pipeline CRM</div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="회사, 담당자, 메모 검색…" />
  </div>
  <div class="spacer"></div>
  <button class="btn icon-btn" id="themeBtn" title="테마 전환">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="btn btn-primary" id="addBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    새 리드
  </button>
</header>

<section class="stats">
  <div class="stat"><div class="label">전체 리드</div><div class="value" id="sTotal">0</div></div>
  <div class="stat"><div class="label">진행 중 파이프라인</div><div class="value" id="sPipeline">₩0</div></div>
  <div class="stat"><div class="label">수주 금액</div><div class="value" id="sWon">₩0</div></div>
  <div class="stat"><div class="label">수주율</div><div class="value" id="sRate">0%</div></div>
</section>

<main class="board" id="board"></main>

<div class="overlay" id="overlay">
  <form class="modal" id="form" autocomplete="off">
    <div class="modal-head"><h2 id="modalTitle">새 리드 등록</h2></div>
    <div class="modal-body">
      <div class="field full"><label>회사명 *</label><input name="company" required placeholder="예: 에이아이랩스" /></div>
      <div class="field"><label>담당자</label><input name="contact" placeholder="홍길동" /></div>
      <div class="field"><label>직책</label><input name="title" placeholder="구매팀장" /></div>
      <div class="field"><label>이메일</label><input name="email" type="email" placeholder="name@company.com" /></div>
      <div class="field"><label>전화번호</label><input name="phone" placeholder="010-0000-0000" /></div>
      <div class="field"><label>예상 금액 (원)</label><input name="value" type="number" min="0" step="10000" placeholder="10000000" /></div>
      <div class="field"><label>예상 마감일</label><input name="closeDate" type="date" /></div>
      <div class="field"><label>단계</label><select name="stage" id="stageSelect"></select></div>
      <div class="field"><label>우선순위</label>
        <select name="priority"><option value="high">높음</option><option value="mid" selected>보통</option><option value="low">낮음</option></select>
      </div>
      <div class="field full"><label>메모</label><textarea name="notes" placeholder="리드 관련 메모"></textarea></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-danger" id="deleteBtn">삭제</button>
      <div class="spacer"></div>
      <button type="button" class="btn" id="cancelBtn">취소</button>
      <button type="submit" class="btn btn-primary">저장</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const STAGES = [
  { id: 'new',         name: '신규 리드',   color: '#8a90a2' },
  { id: 'contacted',   name: '첫 컨택',     color: '#3b9eff' },
  { id: 'qualified',   name: '니즈 확인',   color: '#00b8a9' },
  { id: 'proposal',    name: '제안/견적',   color: '#a46bff' },
  { id: 'negotiation', name: '협상',        color: '#f5a524' },
  { id: 'won',         name: '수주',        color: '#2fb164' },
  { id: 'lost',        name: '실주',        color: '#e5484d' },
];
const AVATAR_COLORS = ['#5b5bf7','#00b8a9','#f5a524','#e5484d','#a46bff','#3b9eff','#2fb164'];
const STORE_KEY = 'crm.leads.v1';
const PRIO_LABEL = { high: '높음', mid: '보통', low: '낮음' };

const $ = (s) => document.querySelector(s);
const won = (n) => '₩' + Math.round(n || 0).toLocaleString('ko-KR');
const shortWon = (n) => {
  n = n || 0;
  if (n >= 1e8) return '₩' + (n / 1e8).toFixed(1).replace(/\.0$/, '') + '억';
  if (n >= 1e4) return '₩' + Math.round(n / 1e4).toLocaleString('ko-KR') + '만';
  return won(n);
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function seed() {
  const d = (days) => new Date(Date.now() + days * 864e5).toISOString().slice(0, 10);
  return [
    { company: '한빛소프트웨어', contact: '김민지', title: 'CTO', value: 45000000, stage: 'new', priority: 'high', closeDate: d(30) },
    { company: '그린에너지㈜', contact: '이준호', title: '구매팀장', value: 12000000, stage: 'new', priority: 'low', closeDate: d(45) },
    { company: '스마트로지스', contact: '박서연', title: '운영이사', value: 28000000, stage: 'contacted', priority: 'mid', closeDate: d(21) },
    { company: '메디케어랩', contact: '최도윤', title: 'IT 매니저', value: 67000000, stage: 'qualified', priority: 'high', closeDate: d(18) },
    { company: '퓨처리테일', contact: '정하은', title: '마케팅 본부장', value: 35000000, stage: 'proposal', priority: 'mid', closeDate: d(12) },
    { company: '오션핀테크', contact: '강지훈', title: '대표', value: 120000000, stage: 'negotiation', priority: 'high', closeDate: d(7) },
    { company: '블루밍에듀', contact: '윤채원', title: '교육팀장', value: 18000000, stage: 'won', priority: 'mid', closeDate: d(-3) },
    { company: '트라이앵글푸드', contact: '임성민', title: '총무팀', value: 9000000, stage: 'lost', priority: 'low', closeDate: d(-10) },
  ].map(l => ({ id: uid(), email: '', phone: '', notes: '', createdAt: Date.now(), ...l }));
}

let leads;
try { leads = JSON.parse(localStorage.getItem(STORE_KEY)) || seed(); } catch { leads = seed(); }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(leads)); } catch {} };

let query = '';
let editingId = null;
let draggedId = null;

/* ---------- Render ---------- */
function render() {
  const board = $('#board');
  board.innerHTML = '';
  const q = query.trim().toLowerCase();
  const visible = leads.filter(l => !q ||
    [l.company, l.contact, l.title, l.notes, l.email].some(v => (v || '').toLowerCase().includes(q)));

  STAGES.forEach(stage => {
    const items = visible.filter(l => l.stage === stage.id);
    const sum = items.reduce((a, l) => a + (+l.value || 0), 0);
    const col = document.createElement('section');
    col.className = 'column';
    col.dataset.stage = stage.id;
    col.innerHTML = `
      <div class="col-head">
        <div class="col-title"><span class="dot" style="background:${stage.color}"></span>${stage.name}
          <span class="count">${items.length}</span></div>
        <div class="col-sum">${won(sum)}</div>
      </div>
      <div class="cards"></div>
      <button class="add-inline">+ 리드 추가</button>`;
    const list = col.querySelector('.cards');
    if (!items.length) list.innerHTML = '<div class="empty">여기로 카드를 끌어오세요</div>';
    items.forEach(l => list.appendChild(cardEl(l)));
    col.querySelector('.add-inline').onclick = () => openModal(null, stage.id);
    bindDrop(col);
    board.appendChild(col);
  });
  renderStats();
}

function cardEl(l) {
  const el = document.createElement('article');
  el.className = 'card';
  el.draggable = true;
  el.dataset.id = l.id;
  const initials = (l.contact || l.company || '?').trim().slice(0, 1);
  const color = AVATAR_COLORS[[...(l.company || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % AVATAR_COLORS.length];
  const overdue = l.closeDate && l.stage !== 'won' && l.stage !== 'lost' && new Date(l.closeDate) < new Date(new Date().toDateString());
  el.innerHTML = `
    <div class="card-top">
      <div>
        <div class="card-company">${esc(l.company)}</div>
        <div class="card-contact">${esc(l.contact)}${l.title ? ' · ' + esc(l.title) : ''}</div>
      </div>
      <div class="avatar" style="background:${color}">${esc(initials)}</div>
    </div>
    <div class="card-value">${won(l.value)}</div>
    <div class="card-foot">
      <span class="tag prio-${l.priority}">${PRIO_LABEL[l.priority] || '보통'}</span>
      <span class="card-date" style="${overdue ? 'color:var(--danger);font-weight:600' : ''}">
        ${l.closeDate ? '📅 ' + l.closeDate.slice(5).replace('-', '/') : ''}</span>
    </div>`;
  el.addEventListener('click', () => openModal(l.id));
  el.addEventListener('dragstart', (e) => {
    draggedId = l.id;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', l.id);
    requestAnimationFrame(() => el.classList.add('dragging'));
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    document.querySelectorAll('.placeholder').forEach(p => p.remove());
    document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
    draggedId = null;
  });
  return el;
}

/* ---------- Drag & Drop ---------- */
const placeholder = document.createElement('div');
placeholder.className = 'placeholder';

function afterElement(list, y) {
  const cards = [...list.querySelectorAll('.card:not(.dragging)')];
  return cards.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    return offset < 0 && offset > closest.offset ? { offset, el: child } : closest;
  }, { offset: -Infinity, el: null }).el;
}

function bindDrop(col) {
  const list = col.querySelector('.cards');
  col.addEventListener('dragover', (e) => {
    if (!draggedId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.column.drag-over').forEach(c => c !== col && c.classList.remove('drag-over'));
    col.classList.add('drag-over');
    const after = afterElement(list, e.clientY);
    after ? list.insertBefore(placeholder, after) : list.appendChild(placeholder);
  });
  col.addEventListener('dragleave', (e) => {
    if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
  });
  col.addEventListener('drop', (e) => {
    e.preventDefault();
    const id = draggedId || e.dataTransfer.getData('text/plain');
    const lead = leads.find(l => l.id === id);
    if (!lead) return;
    const nextCard = placeholder.nextElementSibling?.closest?.('.card');
    const prevStage = lead.stage;
    lead.stage = col.dataset.stage;
    // reorder within the array to persist position
    leads = leads.filter(l => l.id !== id);
    const idx = nextCard ? leads.findIndex(l => l.id === nextCard.dataset.id) : -1;
    idx >= 0 ? leads.splice(idx, 0, lead) : leads.push(lead);
    save();
    render();
    if (prevStage !== lead.stage) {
      const st = STAGES.find(s => s.id === lead.stage);
      toast(`${lead.company} → ${st.name}${lead.stage === 'won' ? ' 🎉' : ''}`);
    }
  });
}

/* ---------- Stats ---------- */
function renderStats() {
  const active = leads.filter(l => l.stage !== 'won' && l.stage !== 'lost');
  const wonL = leads.filter(l => l.stage === 'won');
  const lostL = leads.filter(l => l.stage === 'lost');
  const sum = (a) => a.reduce((s, l) => s + (+l.value || 0), 0);
  $('#sTotal').textContent = leads.length;
  $('#sPipeline').textContent = shortWon(sum(active));
  $('#sWon').textContent = shortWon(sum(wonL));
  const closed = wonL.length + lostL.length;
  $('#sRate').textContent = closed ? Math.round(wonL.length / closed * 100) + '%' : '—';
}

/* ---------- Modal ---------- */
const form = $('#form');
$('#stageSelect').innerHTML = STAGES.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

function openModal(id, stage = 'new') {
  editingId = id;
  form.reset();
  const lead = id ? leads.find(l => l.id === id) : null;
  $('#modalTitle').textContent = lead ? '리드 수정' : '새 리드 등록';
  $('#deleteBtn').style.display = lead ? '' : 'none';
  if (lead) Object.entries(lead).forEach(([k, v]) => { if (form.elements[k]) form.elements[k].value = v ?? ''; });
  else form.elements.stage.value = stage;
  $('#overlay').classList.add('open');
  setTimeout(() => form.elements.company.focus(), 50);
}
const closeModal = () => { $('#overlay').classList.remove('open'); editingId = null; };

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  data.value = +data.value || 0;
  if (editingId) {
    Object.assign(leads.find(l => l.id === editingId), data);
    toast('리드가 수정되었습니다');
  } else {
    leads.push({ id: uid(), createdAt: Date.now(), ...data });
    toast('새 리드가 등록되었습니다');
  }
  save(); render(); closeModal();
});
$('#deleteBtn').onclick = () => {
  if (!editingId || !confirm('이 리드를 삭제할까요?')) return;
  leads = leads.filter(l => l.id !== editingId);
  save(); render(); closeModal(); toast('삭제되었습니다');
};
$('#cancelBtn').onclick = closeModal;
$('#overlay').addEventListener('mousedown', (e) => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'n' && !$('#overlay').classList.contains('open') && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); openModal(null);
  }
});
$('#addBtn').onclick = () => openModal(null);
$('#search').addEventListener('input', (e) => { query = e.target.value; render(); });

/* ---------- Theme ---------- */
const THEME_KEY = 'crm.theme';
try { const t = localStorage.getItem(THEME_KEY); if (t) document.documentElement.dataset.theme = t; } catch {}
$('#themeBtn').onclick = () => {
  const isDark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch {}
};

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

render();
</script>
</body>
</html>
